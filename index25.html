<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynava Larnaca — Onboarding</title>
<style>
:root{
  --ground:#F6F4F0; --panel:#FFFFFF; --ink:#16202B; --muted:#5D6773;
  --line:#E2DED6; --line-2:#D5D0C6;
  --bar:#17293A; --bar-line:#33485C; --bar-ink:#C2CEDA; --bar-field:#22384C; --bar-mark:#6FB3CE;
  --accent:#1E5F79; --accent-soft:#F0F6F8; --accent-line:#C3D6DE;
  --ok:#2F6B4F; --ok-soft:#EAF1EC; --ok-line:#A9C6B5;
  --warn:#8A6218; --warn-soft:#FFF8E9; --warn-line:#DCC489;
  --bad:#9A3F33; --bad-soft:#FBEDEA; --bad-line:#D9A9A0;
  --r:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14181D; --panel:#1B2026; --ink:#E9EBEE; --muted:#9AA3AE;
    --line:#2C333B; --line-2:#3A424C;
    --bar:#0F171F; --bar-line:#2A3A4A; --bar-ink:#A8B6C4; --bar-field:#1B2833; --bar-mark:#6FB3CE;
    --accent:#6FAFC9; --accent-soft:#16262E; --accent-line:#2C4752;
    --ok:#7CC09A; --ok-soft:#16241C; --ok-line:#2E4A38;
    --warn:#DDB268; --warn-soft:#241E12; --warn-line:#4A3D22;
    --bad:#DD9084; --bad-soft:#251815; --bad-line:#4C2E28;
  }
}
:root[data-theme="dark"]{
  --ground:#14181D; --panel:#1B2026; --ink:#E9EBEE; --muted:#9AA3AE;
  --line:#2C333B; --line-2:#3A424C;
  --bar:#0F171F; --bar-line:#2A3A4A; --bar-ink:#A8B6C4; --bar-field:#1B2833; --bar-mark:#6FB3CE;
  --accent:#6FAFC9; --accent-soft:#16262E; --accent-line:#2C4752;
  --ok:#7CC09A; --ok-soft:#16241C; --ok-line:#2E4A38;
  --warn:#DDB268; --warn-soft:#241E12; --warn-line:#4A3D22;
  --bad:#DD9084; --bad-soft:#251815; --bad-line:#4C2E28;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.3}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* topbar */
.bar{background:var(--bar);position:sticky;top:0;z-index:30}
.bar-in{max-width:1180px;margin:0 auto;height:52px;padding:0 16px;display:flex;align-items:center;gap:18px}
.logo{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:600;color:#fff;font-style:italic;letter-spacing:-.01em;text-decoration:none;flex:none}
.sep{width:1px;height:20px;background:var(--bar-line);flex:none}
.bar nav{display:flex;gap:18px;align-items:center;flex:none}
.bar nav button{background:none;border:0;color:var(--bar-ink);font-size:13.5px;padding:4px 0;border-bottom:2px solid transparent}
.bar nav button.on{color:#fff;font-weight:500;border-bottom-color:var(--bar-mark)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.find{position:relative}
.find input{width:220px;height:30px;padding:0 10px;border:1px solid var(--bar-line);border-radius:var(--r);background:var(--bar-field);color:#fff;font:inherit;font-size:13px}
.find input::placeholder{color:#7C8FA1}
.find input:focus{outline:2px solid var(--bar-mark);outline-offset:-1px}
.hits{position:absolute;top:36px;right:0;width:340px;max-width:78vw;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:60vh;overflow:auto;display:none}
.hits.on{display:block}
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 13px}
.hit:last-child{border-bottom:0}
.hit:hover{background:var(--accent-soft)}
.hit b{display:block;font-size:13.5px;font-weight:600}
.hit small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
.hit .where{color:var(--accent);font-size:11.5px;margin-top:5px;display:block}
.hit.off{opacity:.6}
.me{width:30px;height:30px;border-radius:50%;background:#2C4356;color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.bell{position:relative;background:none;border:1px solid var(--bar-line);border-radius:var(--r);width:30px;height:30px;display:grid;place-items:center;color:var(--bar-ink)}
.bell span{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:99px;background:#C7622E;color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 56px;display:flex;gap:22px;align-items:flex-start}
.col-main{flex:1 1 auto;min-width:0}
.col-side{width:290px;flex:none;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 18px}
.lead{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.lead:first-child{margin-top:0}

/* path */
.track{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.step{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;display:flex;gap:12px;align-items:center;margin-bottom:6px}
.step.now{border-color:var(--accent);border-left:3px solid var(--accent);padding-left:12px}
.step.off{opacity:.6;cursor:default}
.step:not(.off):hover{border-color:var(--accent)}
.n{width:22px;height:22px;flex:none;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.step.now .n{background:var(--accent);border-color:var(--accent);color:#fff}
.step .t{flex:1 1 auto;min-width:0}
.step .t b{display:block;font-size:14px;font-weight:600}
.step .t small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:5px;padding:3px 8px;border:1px solid var(--line-2);background:var(--ground);color:var(--muted);white-space:nowrap}
.chip.go{background:var(--accent);border-color:var(--accent);color:#fff;padding:4px 10px}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.chip.wait{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.chip.redo{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-line)}

/* notes */
.note{border-radius:var(--r);padding:13px 15px;font-size:13px;line-height:1.55}
.note.warn{background:var(--warn-soft);border:1px solid var(--warn-line)}
.note.ok{background:var(--ok-soft);border:1px solid var(--ok-line)}
.note b{display:block;font-size:12.5px;margin-bottom:5px}
.note.warn b{color:var(--warn)}
.note.ok b{color:var(--ok)}
.pill{display:inline-block;text-decoration:none;font-size:12px;color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:99px;padding:4px 9px;margin:0 5px 5px 0}

/* course */
.crumb{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.crumb button{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:16px 0 22px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 15px;font-size:14px;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.prose{font-family:Newsreader,Georgia,serif;font-size:16.5px;line-height:1.65;color:var(--ink)}
.prose h2{font-family:Newsreader,Georgia,serif;font-size:20px;font-weight:600;margin:26px 0 10px}
.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 14px}
.prose strong{font-weight:600}
.pull{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:20px 0}
.pull .k{font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.pull p{margin:0;font-size:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.three div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px;font-family:"IBM Plex Sans",sans-serif}
.three b{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
.three span{font-size:13px;line-height:1.5;color:var(--muted)}
.xlink{display:block;width:100%;text-align:left;background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:var(--r);padding:13px 15px;margin:16px 0;font-family:"IBM Plex Sans",sans-serif}
.xlink:hover{border-color:var(--accent)}
.xlink .xk{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.xlink .xt{display:block;font-size:15px;font-weight:600}
.xlink .xd{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.xlink .xl{display:inline-block;font-size:12px;color:var(--muted);margin-top:7px;border:1px solid var(--line-2);border-radius:5px;padding:2px 7px}
.xlink[data-locked] .xt{opacity:.7}
.exer{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin:12px 0;font-family:"IBM Plex Sans",sans-serif}
.exer .k{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.exer .exq{margin:0 0 10px;font-size:15px;font-weight:500}
.exs{margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
.exs .stop{list-style:none;margin-left:-20px;margin-top:6px;color:var(--muted);font-style:italic}
.edins{text-align:center;margin:6px 0}
.edins .btn{font-size:12px;padding:4px 10px;border-style:dashed}
.edmove{position:absolute;top:-11px;left:8px;display:inline-flex;gap:4px}
.edmove .btn{font-size:11px;padding:2px 7px;background:var(--panel)}
.edwrap{position:relative;border:1px dashed var(--line-2);border-radius:6px;padding:4px 10px 2px;margin:8px 0}
.edpen{position:absolute;top:-11px;right:8px;display:inline-flex;align-items:center;gap:4px;font:600 11.5px "IBM Plex Sans",sans-serif;background:var(--panel);border:1px solid var(--line-2);border-radius:5px;padding:2px 7px;color:var(--accent);cursor:pointer}
.edbox{border:2px solid var(--accent);border-radius:8px;padding:14px;margin:10px 0;background:var(--panel);font-family:"IBM Plex Sans",sans-serif}
.edbox .edk{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.edbox label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:8px 0 4px}
.edbox input,.edbox textarea{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)}
.edhint{font-size:12px;color:var(--muted);margin-top:5px}
.kont{padding:9px 0;border-top:1px solid var(--line)}
.kont:first-of-type{border-top:0}
.kont .kl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kont .kv{display:block;font-size:13.5px;color:var(--ink)}
.star-btn{background:none;border:0;color:var(--muted);font-size:16px;padding:4px 8px;cursor:pointer;flex:none}
.star-btn.on{color:#DDB268}
.logrow{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:6px}
button.logrow:hover{border-color:var(--accent)}
.logrow .ld{font-size:12px;color:var(--muted)}
.logrow .lt{font-size:14.5px;font-weight:600;margin:3px 0 2px}
.logrow .ls{font-size:13.5px;line-height:1.5}
.logbox{border-top:1px solid var(--line);margin-top:12px;padding-top:2px}
.edbox select{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)}
@keyframes flash{0%,55%{background:var(--warn-soft);box-shadow:0 0 0 8px var(--warn-soft)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.flash{animation:flash 2.6s ease-out;border-radius:4px}
.star-btn{position:relative}
.star-btn::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);right:0;white-space:nowrap;background:var(--bar);color:#fff;font:500 12px "IBM Plex Sans",sans-serif;line-height:1.3;padding:5px 9px;border-radius:5px;opacity:0;pointer-events:none;transform:translateY(2px);transition:opacity .12s,transform .12s;z-index:25}
.star-btn.lft::after{left:0;right:auto}
.star-btn:hover::after,.star-btn:focus-visible::after{opacity:1;transform:none}
.stepopen{background:none;border:0;text-align:left;flex:1 1 auto;min-width:0;display:flex;gap:12px;align-items:center;padding:0;cursor:pointer}
.stepopen:disabled{cursor:default}
.quick{font-size:14px;line-height:1.6}
.quick div{padding:10px 0;border-bottom:1px solid var(--line)}
.quick div:last-child{border-bottom:0}
.quick b{color:var(--ink)}
.facts div{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);line-height:1.65}
.facts span{color:var(--ink)}

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r);padding:9px 16px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.main:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line-2)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* test */
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:8px}
.q .qt{font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:13.5px;margin-bottom:6px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt .box{width:16px;height:16px;flex:none;border:1.5px solid var(--line-2);margin-top:1px}
.opt .box.rd{border-radius:50%}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .box{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2.5px var(--panel)}
.opt.good{border-color:var(--ok);background:var(--ok-soft);font-weight:500}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mark{margin-left:auto;font-size:12.5px;flex:none;padding-left:8px}
.why{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--muted)}
textarea{width:100%;font:inherit;font-size:13.5px;line-height:1.55;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);color:var(--ink);resize:vertical;min-height:88px}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.score{display:flex;gap:16px;align-items:flex-start}
.score .big{width:72px;height:72px;flex:none;border-radius:8px;display:grid;place-items:center;align-content:center}
.score .big b{font-size:24px;font-weight:600;line-height:1}
.score .big small{font-size:12.5px}
.pass{background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok)}
.fail{background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--bad)}

/* admin */
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filters button{background:var(--panel);border:1px solid var(--line-2);border-radius:99px;padding:7px 14px;font-size:13px}
.filters button.on{background:var(--bar);border-color:var(--bar);color:#fff;font-weight:500}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.said{background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-family:Newsreader,Georgia,serif;font-size:15px;line-height:1.6;margin-bottom:14px;white-space:pre-wrap}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:34px 16px;text-align:center;color:var(--muted)}
.foot{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12.5px}
.foot button{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:12.5px}

@media (max-width:900px){
  .wrap{flex-direction:column;padding-top:16px}
  .col-side{width:100%}
  .three{grid-template-columns:1fr}
  .bar-in{gap:12px}
  .find input{width:150px}
  .bar nav{gap:14px}
  .prose{font-size:16px}
}
@media (max-width:620px){
  .bar-in{flex-wrap:wrap;height:auto;padding:8px 12px;gap:10px}
  .find{order:5;width:100%}
  .find input{width:100%}
  .hits{width:100%}
  .wrap{padding-left:12px;padding-right:12px}
  .step{align-items:flex-start}
  .chip{font-size:11.5px}
}
</style>

</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="logo" href="#" id="home">Dynava</a>
    <div class="sep"></div>
    <nav>
      <button id="navPath" class="on">Huvudyta</button>
      <button id="navTrouble">Felsökning</button>
      <button id="navLog">Ändringar</button>
      <button id="navAdmin">Granskning</button>
      <button id="navUsers">Användare</button>
    </nav>
    <div class="bar-right">
      <div class="find">
        <label class="sr" for="q">Sök i allt innehåll</label>
        <input id="q" type="search" placeholder="Sök i allt innehåll" autocomplete="off">
        <div class="hits" id="hits"></div>
      </div>
      <button class="bell" id="bell" aria-label="Kommentarer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v12H8l-4 4z"></path></svg>
      </button>
      <div class="me" id="me">JS</div>
    </div>
  </div>
</header>

<main id="view"></main>
<div class="foot" id="foot"></div>

<script>
/* ---------- innehåll ---------- */
var COURSES=[], IMG={}, FAQ=[];

var PASS = 0.8;
var VERSION = '25';

/* ---------- tillstånd ---------- */
var KEY='dynava-larnaca-build';
var S={role:'agent', page:'path', course:null, tab:'learn', draft:{}, p:{}, build:false, kb:false};
var BOOKMARKS=[];
try{ BOOKMARKS=JSON.parse(localStorage.getItem('dynava-bookmarks')||'[]'); if(!Array.isArray(BOOKMARKS)) BOOKMARKS=[]; }catch(e){ BOOKMARKS=[]; }
function saveBookmarks(){ try{ localStorage.setItem('dynava-bookmarks', JSON.stringify(BOOKMARKS)); }catch(e){} }
function isBookmarked(id){ return BOOKMARKS.indexOf(id)>-1; }
function favTip(id){ return isBookmarked(id)?'Ta bort från favoriter':'Lägg till som favorit'; }
function toggleBookmark(id){ var k=BOOKMARKS.indexOf(id); if(k>-1) BOOKMARKS.splice(k,1); else BOOKMARKS.push(id); saveBookmarks(); }
try{ var raw=localStorage.getItem(KEY); if(raw==='1') S.build=true; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, S.build?'1':'0'); }catch(e){} syncProgress(); }
function rec(id){ if(!S.p[id]) S.p[id]={}; return S.p[id]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function status(i){
  if(i<0||i>=COURSES.length) return 'open';
  var c=COURSES[i], r=S.p[c.id]||{};
  if(r.st) return r.st;
  if(CAN_EDIT) return 'open';
  for(var j=0;j<i;j++){
    var pc=COURSES[j];
    if(!pc.test || !(pc.q||[]).length) continue;
    var pr=S.p[pc.id]||{}; if(pr.st!=='done') return 'locked';
  }
  return 'open';
}
function kbUnlocked(){
  if(CAN_EDIT) return true;
  if(!COURSES.length) return false;
  for(var i=0;i<COURSES.length;i++){ if(status(i)!=='done') return false; }
  return true;
}
function stepsLeft(){ var n=0; for(var i=0;i<COURSES.length;i++){ if(status(i)!=='done') n++; } return n; }
var LABEL={locked:'Låst', open:'Öppen', redo:'Ta om testet', wait:'Väntar på granskning', done:'Godkänd'};

function icon(n){
  var p={
    lock:'<rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8.5 11V7.5a3.5 3.5 0 017 0V11"></path>',
    check:'<circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path>',
    arrow:'<path d="M5 12h13"></path><path d="M12.5 6.5L19 12l-6.5 5.5"></path>',
    clock:'<circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path>',
    redo:'<path d="M4 12a8 8 0 1 1 2.5 5.8"></path><path d="M4 18v-5h5"></path>',
    x:'<circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6"></path><path d="M15 9l-6 6"></path>',
    note:'<path d="M4 5h16v12H8l-4 4z"></path>'
  }[n]||'';
  return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}
function chip(st){
  if(st==='done') return '<span class="chip ok">'+icon('check')+'Godkänd</span>';
  if(st==='open') return '<span class="chip go">'+icon('arrow')+'Fortsätt</span>';
  if(st==='wait') return '<span class="chip wait">'+icon('clock')+'Väntar</span>';
  if(st==='redo') return '<span class="chip redo">'+icon('redo')+'Ta om</span>';
  return '<span class="chip">'+icon('lock')+'Låst</span>';
}
function unseen(){ var n=0; for(var k in S.p){ if(S.p[k].note && !S.p[k].noteSeen) n++; } return n; }
function need(c){ return c.gate ? Math.ceil((c.q||[]).length*PASS) : 0; }

/* ---------- vyer ---------- */
function vPath(){
  var done=0; for(var i=0;i<COURSES.length;i++){ if(status(i)==='done') done++; }
  var h='<div class="wrap"><div class="col-main">';
  h+='<div class="card pad" style="margin-bottom:8px">'+
     '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
     '<h1 style="font-size:17px;font-weight:600">'+(S.kb?'Uppslagsverk':'Din väg in')+'</h1>'+
     '<div style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
     (!S.kb?'<span style="font-size:13px;color:var(--muted);margin-right:8px">'+done+' av '+COURSES.length+' klara</span>':'')+
     '<button class="btn'+(!S.kb?' main':'')+'" id="toPath">Utbildningsväg</button>'+
     (kbUnlocked()
       ? '<button class="btn'+(S.kb?' main':'')+'" id="toKb">Uppslagsverk</button>'
       : '<button class="btn" id="toKb" disabled title="Öppnas när du gått igenom utbildningen">'+icon('lock')+' Uppslagsverk</button>')+
     '</div></div>'+
     (S.kb
       ? '<p style="margin:4px 0 0;font-size:13.5px;color:var(--muted)">Allt innehåll öppet för läsning, till exempel mitt i ett samtal. Genomgångarna görs i Utbildningsväg, och inget här påverkar dina framsteg.</p></div>'
       : '<p style="margin:4px 0 0;font-size:13.5px;color:var(--muted)">Nästa steg öppnas när du klarat genomgången.'+
         (kbUnlocked() ? ' Allt du gått igenom går att slå upp igen.' : ' Uppslagsverket öppnas när du gått igenom hela utbildningen. '+stepsLeft()+' steg kvar.')+'</p>'+
         '<div class="track"><i style="width:'+(done/COURSES.length*100)+'%"></i></div></div>');
  var sec='';
  for(var i=0;i<COURSES.length;i++){
    var c=COURSES[i], st=status(i), locked=(!S.kb && st==='locked');
    var info=(!c.test || !(c.q||[]).length);
    if(c.sec!==sec){ sec=c.sec; h+='<div class="lead">'+esc(sec)+'</div>'; }
    var cls='step'+(S.kb||st==='open'?' now':'')+(locked?' off':'');
    var right = S.kb ? '<span class="chip go">Läs</span>'
              : (info && !locked ? '<span class="chip">'+icon('note')+(st==='done'?'Läst':'Information')+'</span>' : chip(st));
    h+='<div class="'+cls+'"'+(locked?'':' data-open="'+c.id+'" style="cursor:pointer"')+'>'+
       '<button class="stepopen" data-open="'+c.id+'"'+(locked?' disabled':'')+'>'+
       (S.kb?'':'<span class="n">'+(i+1)+'</span>')+
       '<span class="t"><b>'+esc(c.title)+'</b><small>'+esc(c.sum)+'</small></span></button>'+
       '<button class="star-btn'+(isBookmarked(c.id)?' on':'')+'" data-bm="'+c.id+'" data-tip="'+favTip(c.id)+'" aria-label="'+favTip(c.id)+': '+esc(c.title)+'">★</button>'+
       right+'</div>';
  }

function loadImages(){
  if(!sb) return;
  document.querySelectorAll('img[data-imgkey]').forEach(function(el){
    var k=el.getAttribute('data-imgkey');
    if(IMG[k]){ if(!el.getAttribute('src')) el.src=IMG[k]; return; }
    if(loadImages.pending[k]) return; loadImages.pending[k]=true;
    sb.from('images').select('data').eq('key',k).maybeSingle().then(function(res){

function rowFromRec(cid, r){
  return {email:ME, course_id:cid, status:r.st||'open', right_count:(typeof r.right==='number')?r.right:null,
          answers:r.answers||null, free_text:r.free||null, note:r.note||null, note_seen:r.noteSeen!==false};
}
function recFromRow(x){
  return {st:x.status, right:x.right_count, answers:x.answers, free:x.free_text||'', note:x.note||'', noteSeen:x.note_seen,
          when:x.updated_at?new Date(x.updated_at).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'}):''};
}
function syncProgress(){
  if(!sb||!ME) return;
  Object.keys(S.p).forEach(function(cid){
    var row=rowFromRec(cid, S.p[cid]), sig=JSON.stringify(row);
    if(SYNCED[cid]===sig) return; SYNCED[cid]=sig;
    row.updated_at=new Date().toISOString();
    sb.from('progress').upsert(row).then(function(res){ if(res.error){ SYNCED[cid]=null; alert('Framsteget kunde inte sparas. '+res.error.message); } });
  });
}
function loadProgress(){
  return sb.from('progress').select('*').then(function(res){
    var rows=res.data||[]; ALLP=rows;
    S.p={}; SYNCED={};
    rows.filter(function(x){return x.email===ME;}).forEach(function(x){ S.p[x.course_id]=recFromRow(x); SYNCED[x.course_id]=JSON.stringify(rowFromRec(x.course_id,S.p[x.course_id])); });

}

/* export och import */
function exportAll(){
  var msg=document.getElementById('ioMsg'); if(msg) msg.textContent='Hämtar...';
  Promise.all([sb.from('courses').select('*'), sb.from('images').select('key,data'), sb.from('change_log').select('*')]).then(function(r){
    var out={exported:new Date().toISOString(), version:VERSION, courses:r[0].data||[], images:{}, changelog:r[2].data||[]};
    (r[1].data||[]).forEach(function(x){ out.images[x.key]=x.data; });
    var blob=new Blob([JSON.stringify(out)],{type:'application/json'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='dynava-onboarding-export.json'; document.body.appendChild(a); a.click(); a.remove();
    if(msg) msg.textContent='Klart.';
  });
}
document.addEventListener('change', function(e){
  if(e.target.id!=='doImport' || !e.target.files[0]) return;
  var msg=document.getElementById('ioMsg'), rd=new FileReader();
  rd.onload=async function(){
    try{
      var d=JSON.parse(rd.result);
      var courses=(d.courses||[]).map(function(c){ return {id:c.id, ord:+(c.ord!=null?c.ord:c.order)||0, sec:c.sec||'', title:c.title||'', sum:c.sum||'', test:!!c.test, gate:!!c.gate, body:c.body||[], quick:c.quick||[], q:c.q||[], free:c.free||'', updated_at:new Date().toISOString()}; });
      if(!confirm('Importera '+courses.length+' kurser och '+Object.keys(d.images||{}).length+' bilder? Kurser och bilder med samma namn ersätts.')) return;
      msg.textContent='Importerar kurser...';
      var r1=await sb.from('courses').upsert(courses); if(r1.error) throw r1.error;
      var keys=Object.keys(d.images||{});
      for(var i=0;i<keys.length;i+=4){
        msg.textContent='Importerar bilder '+Math.min(i+4,keys.length)+' av '+keys.length+'...';
        var batch=keys.slice(i,i+4).map(function(k){ return {key:k, data:d.images[k]}; });
        var r2=await sb.from('images').upsert(batch); if(r2.error) throw r2.error;
      }
      msg.textContent='Klart. Laddar om...'; setTimeout(function(){ location.reload(); }, 800);
    }catch(err){ msg.textContent='Importen misslyckades: '+(err.message||err); }
  };
  rd.readAsText(e.target.files[0]);
});

function blockType(){ return ['p','h2','pull','ex']; }
function collectForm(orig){
  var box=document.querySelector('.edbox'); if(!box) return null;
  function v(n){ var el=box.querySelector('[data-f="'+n+'"]'); return el?el.value:''; }
  var b=Object.assign({}, orig);
  if(orig.t==='p') b.x=fromEdit(v('md'));
  else if(orig.t==='h2') b.x=v('x');
  else if(orig.t==='pull'){ b.k=v('k'); b.x=v('x'); }
  else if(orig.t==='img') b.cap=v('cap');
  else if(orig.t==='link'){ b.k=v('k'); b.d=v('d'); }
  else if(orig.t==='three'){ b.x=orig.x.map(function(_,j){ return [v('t'+j+'a'), v('t'+j+'b')]; }); }
  else if(orig.t==='ex'){ b.q=v('q'); b.steps=v('steps').split('\n').map(function(x){return x.trim();}).filter(Boolean); }
  return b;
}
var LOG=[], LOGERR='';
function readLogInfo(){
  var box=document.querySelector('.edbox'); if(!box) return {summary:'',source:'Annat',notify:false};
  function f(n){ return box.querySelector('[data-f="'+n+'"]'); }
  return {summary:((f('__sum')||{}).value||'').trim(), source:(f('__src')||{}).value||'Annat', notify:!!(f('__notify')&&f('__notify').checked)};
}
async function logChange(row){
  var r=await sb.from('change_log').insert({course_id:row.course_id||null, block_id:row.block_id||null, summary:row.summary, source:row.source||null, notify:!!row.notify, created_by:ME});
  if(r.error){ alert('Ändringen sparades, men den kom inte med i loggen. '+r.error.message); return false; }
  return true;
}
async function saveBlock(c, nb, li){
  var idx=c.body.findIndex(function(b){ return b.id===nb.id; }); if(idx<0) return;
  var old=c.body[idx]; if(JSON.stringify(old)===JSON.stringify(nb)) return;
  var h=await sb.from('course_history').insert({course_id:c.id, block_id:nb.id, block:old, changed_by:ME});
  if(h.error){ alert('Ändringen kunde inte sparas. '+h.error.message); return; }
  var body=c.body.slice(); body[idx]=nb;
  var u=await sb.from('courses').update({body:body, updated_at:new Date().toISOString()}).eq('id',c.id);
  if(u.error){ alert('Ändringen kunde inte sparas. '+u.error.message); return; }
  if(li) await logChange({course_id:c.id, block_id:nb.id, summary:li.summary, source:li.source, notify:li.notify});
  c.body=body; render.keep=true; render();
}
async function structureChange(c, newBody, what, bid){
  var u=await sb.from('courses').update({body:newBody, updated_at:new Date().toISOString()}).eq('id',c.id);
  if(u.error){ alert('Det gick inte att spara. '+u.error.message); return false; }
  var li=await logChange({course_id:c.id, block_id:bid||null, summary:what, source:'Dynava', notify:false});
  c.body=newBody; render.keep=true; render();
  return true;
}
async function insertBlock(c, pos){
  var kind=prompt('Vad ska det vara? Skriv: text, rubrik eller ruta. (Övningar läggs till senare.)','text');
  if(kind===null) return;
  kind=kind.trim().toLowerCase();
  var t = kind.indexOf('rubrik')===0 ? 'h2' : kind.indexOf('ruta')===0 ? 'pull' : 'p';
  var nb = t==='h2' ? {id:Math.random().toString(16).slice(2,10), t:'h2', x:'Ny rubrik'}
         : t==='pull' ? {id:Math.random().toString(16).slice(2,10), t:'pull', k:'Ny ruta', x:'Skriv här.'}
         : {id:Math.random().toString(16).slice(2,10), t:'p', x:'Skriv här.'};
  var body=c.body.slice(); body.splice(pos,0,nb);
  var ok=await structureChange(c, body, 'Ny sektion tillagd ('+(t==='h2'?'rubrik':t==='pull'?'ruta':'text')+').', nb.id);
  if(ok){ EDITING=nb.id; render.keep=true; render(); }
}
async function moveBlock(c, bid, dir){
  var i=c.body.findIndex(function(b){return b.id===bid;}); var j=i+dir;
  if(i<0||j<0||j>=c.body.length) return;
  var body=c.body.slice(); var tmp=body[i]; body[i]=body[j]; body[j]=tmp;
  await structureChange(c, body, 'Sektion flyttad '+(dir<0?'upp':'ner')+'.', bid);
}
async function deleteBlock(c, bid){
  var i=c.body.findIndex(function(b){return b.id===bid;}); if(i<0) return;
  if(!confirm('Ta bort det här stycket? Det sparas i historiken och kan återställas med Ångra senaste ändring i det stycket.')) return;
  var old=c.body[i];
  await sb.from('course_history').insert({course_id:c.id, block_id:bid, block:old, changed_by:ME});
  var body=c.body.slice(); body.splice(i,1);
  await structureChange(c, body, 'Sektion borttagen.', bid);
}
async function undoBlock(c, bid){
  var r=await sb.from('course_history').select('id,block').eq('course_id',c.id).eq('block_id',bid).order('changed_at',{ascending:false}).limit(1);
  if(r.error){ alert(r.error.message); return; }
  if(!r.data || !r.data.length){ alert('Det finns ingen tidigare version av det här stycket.'); return; }
  var prev=r.data[0].block, idx=c.body.findIndex(function(b){ return b.id===bid; }); if(idx<0) return;
  var body=c.body.slice(); body[idx]=prev;
  var u=await sb.from('courses').update({body:body, updated_at:new Date().toISOString()}).eq('id',c.id);
  if(u.error){ alert(u.error.message); return; }
  await sb.from('course_history').delete().eq('id', r.data[0].id);
  await logChange({course_id:c.id, block_id:bid, summary:'Ångrade senaste ändringen i stycket.', source:'Ångra', notify:false});
  c.body=body; render.keep=true; render();
}
document.addEventListener('click', function(e){
  var t=e.target.closest('[data-edit],[data-esave],[data-ecancel],[data-eundo],[data-insert],[data-up],[data-down],[data-del],#edtoggle');
  if(!t) return;
  var c=byId(S.course); if(!c) return;
  if(t.id==='edtoggle'){ EDITMODE=!EDITMODE; EDITING=null; render.keep=true; return render(); }
  if(t.hasAttribute('data-edit')){ EDITING=t.getAttribute('data-edit'); render.keep=true; render(); var bx=document.querySelector('.edbox'); if(bx) bx.scrollIntoView({block:'center'}); return; }
  if(t.hasAttribute('data-ecancel')){ EDITING=null; render.keep=true; return render(); }
  if(t.hasAttribute('data-insert')){ insertBlock(c, +t.getAttribute('data-insert')); return; }
  if(t.hasAttribute('data-up')){ moveBlock(c, t.getAttribute('data-up'), -1); return; }
  if(t.hasAttribute('data-down')){ moveBlock(c, t.getAttribute('data-down'), 1); return; }
  if(t.hasAttribute('data-del')){ deleteBlock(c, t.getAttribute('data-del')); return; }
  if(t.hasAttribute('data-esave')){
    var bid=t.getAttribute('data-esave'), orig=c.body.find(function(b){return b.id===bid;});
    var nb=orig?collectForm(orig):null, li=readLogInfo();
    if(nb && JSON.stringify(nb)!==JSON.stringify(orig) && li.summary.length<3){ alert('Skriv vad som ändrades. Det visas i Ändringar.'); return; }
    EDITING=null; if(nb) saveBlock(c, nb, li); else { render.keep=true; render(); } return;
  }
  if(t.hasAttribute('data-eundo')){
    if(!confirm('Återställ stycket till versionen före den senaste ändringen?')) return;
    EDITING=null; undoBlock(c, t.getAttribute('data-eundo')); return;
  }
});

async function boot(){
  try{
    if(!window.supabase){ LOADERR='Sidan kunde inte ansluta.'; return render(); }
    sb=window.supabase.createClient(SB_URL, SB_KEY);
    var ses=(await sb.auth.getSession()).data.session;
    if(!ses){ NEEDLOGIN=true; return render(); }
    ME=String(ses.user.email||'').toLowerCase();
    var m=await sb.from('members').select('role,tracks').eq('email',ME).maybeSingle();
    if(!m.data){ LOADERR='Din adress '+ME+' finns inte på listan. Kontakta din utbildningsledare.'; return render(); }
    CAN_EDIT=(m.data.role==='admin');
    var c=await sb.from('courses').select('*').order('ord');
    if(c.error){ LOADERR='Innehållet kunde inte laddas. '+c.error.message; return render(); }
    var all=(c.data||[]).map(sanitizeCourse);
    TROUBLE=all.filter(function(x){ return x.id===TROUBLE_ID; })[0]||null;
    COURSES=all.filter(function(x){ return x.id!==TROUBLE_ID; });
    await loadProgress();
    LOADED=true; buildIdx(); render();
  }catch(err){ LOADERR='Något gick fel. '+(err.message||err); render(); }
}
boot();

function vLog(){
  var h='<div class="wrap"><div class="col-main" style="max-width:820px;margin:0 auto">';
  h+='<h1 style="font-size:22px;font-weight:600">Ändringar</h1>';
  h+='<p style="margin:5px 0 18px;font-size:13.5px;color:var(--muted)">Det som har ändrats i kurserna, med datum, vad som ändrades och varifrån det kom. Klicka på en rad för att komma till det som ändrats.</p>';
  if(CAN_EDIT){
    var opts='<option value="">Hela plattformen</option>';
    COURSES.forEach(function(c){ opts+='<option value="'+esc(c.id)+'">'+esc(c.title)+'</option>'; });
    if(TROUBLE) opts+='<option value="'+esc(TROUBLE.id)+'">'+esc(TROUBLE.title)+'</option>';
    h+='<div class="card pad" style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Lägg till en rad</div>'+
       '<p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">För en ändring som inte gjordes här, till exempel när Moodle har uppdaterats. Rader går inte att ändra eller ta bort.</p>'+
       '<div class="row" style="gap:8px;align-items:stretch">'+
       '<select id="logCourse" style="flex:1 1 180px;font:inherit;padding:9px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)">'+opts+'</select>'+
       '<select id="logSrc" style="font:inherit;padding:9px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)"><option>Moodle</option><option>iBoxen</option><option>PTS</option><option>Dynava</option><option>Annat</option></select></div>'+
       '<input id="logSum" maxlength="500" placeholder="Vad ändrades" style="width:100%;margin-top:8px;font:inherit;padding:9px 11px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)">'+
       '<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px"><input type="checkbox" id="logNotify"> Viktig ändring, ska mejlas ut när mejl finns</label>'+
       '<div class="row" style="margin-top:10px"><button class="btn main" id="logAdd">Lägg till</button><span id="logMsg" style="font-size:13px;color:var(--muted)"></span></div></div>';
  }
  if(LOGERR) h+='<div class="empty">'+esc(LOGERR)+'</div>';
  else if(!LOG.length) h+='<div class="empty">Inga ändringar än. Här visas ändringar i kurserna, med datum, vad som ändrades och varifrån det kom.</div>';
  for(var i=0;i<LOG.length;i++){
    var e=LOG[i], c=e.course_id?byId(e.course_id):null, open=!!c;
    var when=new Date(e.created_at).toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'});
    var inner='<span class="ld">'+esc(when)+(e.source?' · '+esc(e.source):'')+(e.notify?' · viktig':'')+(CAN_EDIT&&e.created_by?' · '+esc(e.created_by):'')+'</span>'+
       '<span class="lt" style="display:block">'+esc(c?c.title:'Hela plattformen')+'</span>'+
       '<span class="ls" style="display:block">'+esc(e.summary)+'</span>';
    h+= open ? '<button class="logrow" data-logopen="'+esc(e.course_id)+'|'+esc(e.block_id||'')+'">'+inner+'</button>'
             : '<div class="logrow">'+inner+'</div>';
  }
  h+='</div></div>';
  return h;
}
document.addEventListener('click', function(e){
  var t=e.target.closest('#navLog,[data-logopen],#logAdd'); if(!t) return;
  if(t.id==='navLog'){ S.page='log'; loadLog().then(function(){ render(); }); return; }
  if(t.id==='logAdd'){
    if(!CAN_EDIT) return;
    var sum=(document.getElementById('logSum').value||'').trim(), msg=document.getElementById('logMsg');
    if(sum.length<3){ msg.textContent='Skriv vad som ändrades.'; return; }
    t.disabled=true; msg.textContent='Sparar...';
    logChange({course_id:document.getElementById('logCourse').value, summary:sum, source:document.getElementById('logSrc').value, notify:document.getElementById('logNotify').checked}).then(function(ok){
      t.disabled=false; if(!ok){ msg.textContent=''; return; }
      loadLog().then(function(){ render.keep=true; render(); });
    });
    return;
  }
  var p=t.getAttribute('data-logopen').split('|'), cid=p[0], bid=p[1];
  if(!cid) return;
  if(!byId(cid)){ alert('Den delen finns inte längre.'); return; }
  var ix=idxOf(cid);
  if(!S.kb && ix>-1 && status(ix)==='locked'){ alert('Den delen öppnas när du kommit dit i ordningen.'); return; }
  S.course=cid; S.tab='learn'; S.page='course'; render();
  if(bid) setTimeout(function(){
    var el=document.querySelector('[data-bid="'+bid+'"]');
    if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); },2800); }
  },40);
});

/* ---------- användare ---------- */
var MEMBERS=[];
function loadMembers(){
  return sb.from('members').select('email,role,created_at').order('email').then(function(r){ MEMBERS=r.data||[]; });
}
function vUsers(){
  if(!CAN_EDIT) return '<div class="wrap"><div class="col-main"><div class="empty">Bara för admin.</div></div></div>';
  var admins=MEMBERS.filter(function(m){return m.role==='admin';}).length;
  var h='<div class="wrap"><div class="col-main" style="max-width:720px;margin:0 auto">';
  h+='<h1 style="font-size:22px;font-weight:600">Användare</h1>';
  h+='<p style="margin:5px 0 18px;font-size:13.5px;color:var(--muted)">Bara adresser på listan kan logga in. Agenter går utbildningen. Admin kan dessutom redigera, granska och hantera användare.</p>';
  h+='<div class="card pad" style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Lägg till användare</div>'+
     '<div class="row" style="gap:8px;align-items:stretch">'+
     '<input id="newEmail" type="email" placeholder="'+mailEx()+'" style="flex:1 1 220px;font:inherit;padding:9px 11px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)">'+
     '<select id="newRole" style="font:inherit;padding:9px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)"><option value="agent">Agent</option><option value="admin">Admin</option></select>'+
     '<button class="btn main" id="addUser">Lägg till</button></div>'+
     '<p id="userMsg" style="margin:8px 0 0;font-size:13px;color:var(--muted)"></p></div>';
  h+='<div class="lead">'+MEMBERS.length+' användare</div>';
  for(var i=0;i<MEMBERS.length;i++){
    var m=MEMBERS[i], self=(m.email===ME), lastAdmin=(m.role==='admin' && admins<=1);
    h+='<div class="card pad" style="margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
       '<span class="av">'+esc(m.email.slice(0,2).toUpperCase())+'</span>'+
       '<span style="flex:1 1 200px;min-width:0;font-size:14px;overflow-wrap:anywhere">'+esc(m.email)+(self?' <span style="color:var(--muted);font-size:12.5px">(du)</span>':'')+'</span>'+
       '<select data-urole="'+esc(m.email)+'"'+((self||lastAdmin)?' disabled title="Går inte att ändra här"':'')+' style="font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)">'+
         '<option value="agent"'+(m.role==='agent'?' selected':'')+'>Agent</option><option value="admin"'+(m.role==='admin'?' selected':'')+'>Admin</option></select>'+
       ((self||lastAdmin)?'':'<button class="btn" data-udel="'+esc(m.email)+'">Ta bort</button>')+
       '</div>';
  }
  h+='</div></div>';
  return h;
}
document.addEventListener('click', function(e){
  var t=e.target.closest('#addUser,[data-udel]'); if(!t || !CAN_EDIT) return;
  if(t.id==='addUser'){
    var em=(document.getElementById('newEmail').value||'').trim().toLowerCase(), role=document.getElementById('newRole').value, msg=document.getElementById('userMsg');
    if(!mailOk(em)){ msg.textContent=mailHint(); return; }
    if(MEMBERS.some(function(m){return m.email===em;})){ msg.textContent='Adressen finns redan på listan.'; return; }
    t.disabled=true; msg.textContent='Lägger till...';
    sb.from('members').insert({email:em, role:role}).then(function(r){
      t.disabled=false;
      if(r.error){ msg.textContent='Det gick inte. '+r.error.message; return; }
      loadMembers().then(function(){ render.keep=true; render(); var m2=document.getElementById('userMsg'); if(m2) m2.textContent=em+' är tillagd.'; });
    });
    return;
  }
  var del=t.getAttribute('data-udel');
  if(del){
    if(del===ME){ alert('Du kan inte ta bort dig själv.'); return; }
    if(!confirm('Ta bort '+del+'? Personen kan inte logga in längre. Framsteg och svar finns kvar.')) return;
    sb.from('members').delete().eq('email',del).then(function(r){
      if(r.error){ alert('Det gick inte. '+r.error.message); return; }
      loadMembers().then(function(){ render.keep=true; render(); });
    });
  }
});
document.addEventListener('change', function(e){
  var em=e.target.getAttribute && e.target.getAttribute('data-urole'); if(!em || !CAN_EDIT) return;
  var role=e.target.value;
  if(em===ME){ alert('Du kan inte ändra din egen roll.'); return; }
  var admins=MEMBERS.filter(function(m){return m.role==='admin';}).length;
  var cur=(MEMBERS.find(function(m){return m.email===em;})||{}).role;
  if(cur==='admin' && role!=='admin' && admins<=1){ alert('Det måste finnas minst en admin.'); render.keep=true; render(); return; }
  sb.from('members').update({role:role}).eq('email',em).then(function(r){
    if(r.error){ alert('Det gick inte. '+r.error.message); }
    loadMembers().then(function(){ render.keep=true; render(); });
  });
});

/* ---------- sök ---------- */
var IDX=[];
function buildIdx(){ IDX=[];
  if(TROUBLE){ for(var ti=0;ti<TROUBLE.body.length;ti++){ var tb=TROUBLE.body[ti]; if(tb.t==='h2') IDX.push({t:tb.x, s:'Felsökning', txt:tb.x.toLowerCase(), id:TROUBLE_ID, i:-1}); if(tb.t==='p'||tb.t==='pull'){ var pt=String(tb.x||'').replace(/<[^>]+>/g,''); IDX.push({t:pt.slice(0,58)+(pt.length>58?'…':''), s:'Felsökning', txt:pt.toLowerCase(), id:TROUBLE_ID, i:-1}); } } }
  for(var i=0;i<COURSES.length;i++){
    var c=COURSES[i];
    IDX.push({t:c.title, s:c.sum, txt:(c.title+' '+c.sum).toLowerCase(), id:c.id, i:i});
    if(c.quick) for(var j=0;j<c.quick.length;j++)
      IDX.push({t:c.quick[j][0], s:c.quick[j][1], txt:(c.quick[j][0]+' '+c.quick[j][1]).toLowerCase(), id:c.id, i:i, quick:true});
    if(c.body) for(var k=0;k<c.body.length;k++){
      var b=c.body[k];
      if(b.t==='h2') IDX.push({t:b.x, s:'Avsnitt i '+c.title, txt:b.x.toLowerCase(), id:c.id, i:i});
      if(b.t==='pull') IDX.push({t:b.k, s:b.x, txt:(b.k+' '+b.x).toLowerCase(), id:c.id, i:i});
      if(b.t==='p'){ var plain=b.x.replace(/<[^>]+>/g,''); IDX.push({t:plain.slice(0,58)+(plain.length>58?'…':''), s:c.title, txt:plain.toLowerCase(), id:c.id, i:i}); }
      if(b.t==='three') for(var m=0;m<b.x.length;m++)
        IDX.push({t:b.x[m][0], s:b.x[m][1], txt:(b.x[m][0]+' '+b.x[m][1]).toLowerCase(), id:c.id, i:i});
    }
    if(c.q) for(var n=0;n<c.q.length;n++)
      IDX.push({t:c.q[n].p, s:'Testfråga i '+c.title, txt:(c.q[n].p+' '+c.q[n].o.join(' ')).toLowerCase(), id:c.id, i:i});
  }
}

function runFind(v){
  var box=document.getElementById('hits');
  v=(v||'').trim().toLowerCase();
  if(v.length<2){ box.classList.remove('on'); box.innerHTML=''; return; }
  var out=[], seen={};
  for(var i=0;i<IDX.length && out.length<9;i++){
    if(IDX[i].txt.indexOf(v)>-1){
      var key=IDX[i].t+IDX[i].id; if(seen[key]) continue; seen[key]=1;
      out.push(IDX[i]);
    }
  }
  if(!out.length){ box.innerHTML='<div class="hit"><small>Ingen träff på '+esc(v)+'</small></div>'; box.classList.add('on'); return; }
  var h='';
  for(var j=0;j<out.length;j++){
    var o=out[j];
    if(o.i===-1){ h+='<button class="hit" data-hit="'+esc(o.id)+'"><b>'+esc(o.t)+'</b><small>'+esc(o.s)+'</small></button>'; continue; }
    if(o.faq){ h+='<button class="hit" data-go="faq"><b>'+esc(o.t)+'</b><small>'+esc(o.s)+'</small></button>'; continue; }
    var locked=!S.kb && status(o.i)==='locked';
    h+='<button class="hit'+(locked?' off':'')+'" data-hit="'+o.id+(o.quick?'|quick':'')+'">'+
       '<b>'+esc(o.t)+'</b><small>'+esc(o.s)+'</small>'+
       '<span class="where">'+esc(COURSES[o.i].title)+(locked?' — låst tills du kommit hit':'')+'</span></button>';
  }
  box.innerHTML=h; box.classList.add('on');
}

/* ---------- rita ---------- */
function render(){
  document.getElementById('navPath').className = (S.page==='admin'||S.page==='users'||S.page==='log'||(S.page==='course'&&S.course===TROUBLE_ID))?'':'on';
  document.getElementById('navLog').className = S.page==='log'?'on':'';
  document.getElementById('navAdmin').className = S.page==='admin'?'on':'';
  document.getElementById('me').textContent = (ME||'?').slice(0,2).toUpperCase();
  document.getElementById('navAdmin').style.display = CAN_EDIT?'':'none';
  document.getElementById('navUsers').style.display = CAN_EDIT?'':'none';
  document.getElementById('navUsers').className = S.page==='users'?'on':'';
  var nt=document.getElementById('navTrouble');
  nt.style.display = TROUBLE?'':'none';
  nt.className = (S.page==='course' && S.course===TROUBLE_ID)?'on':'';
  var n=unseen(), b=document.getElementById('bell');
  b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v12H8l-4 4z"></path></svg>'+(n?'<span>'+n+'</span>':'');
  var v=document.getElementById('view');
  if(NEEDLOGIN){ v.innerHTML=vLogin(); document.getElementById('foot').innerHTML='Version '+VERSION; return; }
  if(!LOADED){
    v.innerHTML='<div class="wrap"><div class="col-main"><div class="empty">'+esc(LOADERR||'Laddar innehållet...')+
      (LOADERR&&sb?'<div style="margin-top:12px"><button class="btn" id="logout">Logga ut</button></div>':'')+'</div></div></div>';
    document.getElementById('foot').innerHTML='Version '+VERSION; return;
  }
  if(S.kb && !kbUnlocked()) S.kb=false;
  if(S.page==='admin') v.innerHTML=vAdmin();
  else if(S.page==='log') v.innerHTML=vLog();
  else if(S.page==='users') v.innerHTML=vUsers();
  else if(S.page==='course') v.innerHTML=vCourse();
  else if(S.page==='test') v.innerHTML=vTest();
  else if(S.page==='result') v.innerHTML=vResult();
  else v.innerHTML=vPath();
  document.getElementById('foot').innerHTML =
    'Inloggad som '+esc(ME)+' &nbsp;·&nbsp; <button id="logout">Logga ut</button>'+
    (CAN_EDIT?' &nbsp;·&nbsp; Admin, alla steg är upplåsta':'')+
    ' &nbsp;·&nbsp; Version '+VERSION;
  if(!render.keep) window.scrollTo(0,0);
  render.keep=false;
  loadImages();
}

document.addEventListener('click', function(e){
  var t=e.target.closest('[data-open],[data-go],[data-tab],[data-read],[data-test],[data-pick],[data-hit],[data-find],#build,#home,#navPath,#navAdmin,#navUsers,#navTrouble,#bell,#toKb,#toPath,[data-bm]');
  if(!t) { document.getElementById('hits').classList.remove('on'); return; }
  var a;
  if(t.id==='toKb'){ if(!kbUnlocked()) return; S.kb=true; render.keep=true; return render(); }
  if(t.id==='toPath'){ S.kb=false; render.keep=true; return render(); }
  if(t.hasAttribute('data-bm')){ toggleBookmark(t.getAttribute('data-bm')); render.keep=true; return render(); }
  if(t.id==='build'){ S.build=!S.build; save(); return render(); }
  if(t.id==='home'){ e.preventDefault(); S.page='path'; return render(); }
  if(t.id==='navPath'){ S.page='path'; return render(); }
  if(t.id==='navAdmin'){ if(!CAN_EDIT) return; S.page='admin'; loadProgress().then(function(){ render(); }); return; }
  if(t.id==='navTrouble'){ if(!TROUBLE) return; S.course=TROUBLE_ID; S.tab='learn'; S.page='course'; return render(); }
  if(t.id==='navUsers'){ if(!CAN_EDIT) return; S.page='users'; loadMembers().then(function(){ render(); }); return; }
  if(t.id==='bell'){ S.page='path'; return render(); }
  if((a=t.getAttribute('data-go'))){ S.page=a; return render(); }
  if((a=t.getAttribute('data-open'))){ if(t.getAttribute('data-viakb') && kbUnlocked()) S.kb=true;
    if(!S.kb && idxOf(a)>-1 && status(idxOf(a))==='locked'){ return; }
    if(t.getAttribute('data-locked')){ alert('Den delen öppnas när du kommit dit i ordningen.'); return; }
    S.course=a; S.tab='learn'; S.page='course'; return render(); }
  if((a=t.getAttribute('data-tab'))){ S.tab=a; return render(); }
  if((a=t.getAttribute('data-read'))){ if(S.kb) return; rec(a).st='done'; save(); S.page='path'; return render(); }
  if((a=t.getAttribute('data-test'))){ if(S.kb) return; S.course=a; S.draft[a]={a:{},free:''}; S.page='test'; return render(); }
  if((a=t.getAttribute('data-find'))){ var f=document.getElementById('q'); f.value=a; f.focus(); runFind(a); return; }
  if((a=t.getAttribute('data-hit'))){
    var parts=a.split('|'); S.course=parts[0]; S.tab=parts[1]==='quick'?'quick':'learn';
    if(!S.kb && status(idxOf(S.course))==='locked') return;
    document.getElementById('hits').classList.remove('on'); document.getElementById('q').value='';
    S.page='course'; return render();
  }
  if((a=t.getAttribute('data-pick'))){
    var p=a.split('-'), qi=+p[0], oi=+p[1], c=byId(S.course), q=c.q[qi];
    var d=S.draft[c.id], cur=d.a[qi]||[];
    if(q.multi){ var at=cur.indexOf(oi); if(at>-1) cur.splice(at,1); else cur.push(oi); d.a[qi]=cur; }
    else d.a[qi]=[oi];
    var f=document.getElementById('free'); if(f) d.free=f.value;
    var y=window.scrollY||window.pageYOffset||0;
    render.keep=true; render(); window.scrollTo(0,y);
    return;
  }
});

document.addEventListener('click', function(e){
  if(e.target.id!=='send') return;
  var c=byId(S.course), d=S.draft[c.id];
  if(S.kb || !d){ return; }
  var f=document.getElementById('free'); if(f) d.free=f.value;
  for(var i=0;i<c.q.length;i++){ if(!(d.a[i]||[]).length){ alert('Fråga '+(i+1)+' är obesvarad.'); return; } }
  if(c.free && d.free.trim().length<10){ alert('Skriv ett svar på fritextfrågan.'); return; }
  var right=0, answers=[];
  for(var j=0;j<c.q.length;j++){ answers.push(d.a[j]); if(same(d.a[j], c.q[j].c)) right++; }
  var r=rec(c.id);
  if(right>(r.right||-1)){ r.right=right; r.answers=answers; }
  r.free=d.free;
  r.when=new Date().toLocaleString('sv-SE',{dateStyle:'short',timeStyle:'short'});
  var passed=right>=need(c);
  r.st = !passed ? 'redo' : (c.gate ? 'wait' : 'done');
  if(!passed){ r.right=right; r.answers=answers; }
  save(); S.page='result'; render();
});

document.addEventListener('click', function(e){
  var rv=e.target && e.target.getAttribute && e.target.getAttribute('data-reveal');
  if(rv){ var el=document.getElementById(rv); if(el){ var on=el.style.display!=='none'; el.style.display=on?'none':'block'; e.target.textContent=on?'Visa hur du gör':'Dölj'; } return; }
  if(e.target && e.target.id==='showRight'){
    var b=document.getElementById('rightBox');
    if(b){ var on=b.style.display!=='none'; b.style.display=on?'none':'block';
      e.target.textContent=on?('Visa de '+b.children.length+' du hade rätt på'):'Dölj'; }
  }
});
document.getElementById('q').addEventListener('input', function(){ runFind(this.value); });
document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Escape'){ this.value=''; runFind(''); } });

render();
</script>
